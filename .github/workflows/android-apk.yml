name: Build APK Android (TWA)

# Génère l'application Android (coquille TWA autour de la PWA).
# Déclenchement manuel depuis l'onglet Actions, ou automatique sur un tag "v*".
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Nom de version affiché (ex. 1.0.0)'
        required: false
        default: '1.0.0'
      version_code:
        description: 'Code de version (entier, à incrémenter à chaque build)'
        required: false
        default: '1'
      publish_release:
        description: 'Publier une release avec lien de téléchargement direct'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restaurer le keystore de signature
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Le secret ANDROID_KEYSTORE_BASE64 est absent — voir android/README.md"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/annualisation-release.jks"

      - name: Compiler l'APK et l'AAB signés
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/annualisation-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: annualisation
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_NAME: ${{ github.event.inputs.version_name || github.ref_name }}
          VERSION_CODE: ${{ github.event.inputs.version_code || github.run_number }}
        run: gradle --no-daemon assembleRelease bundleRelease

      - name: Renommer les fichiers produits
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/annualisation.apk
          cp android/app/build/outputs/bundle/release/app-release.aab dist/annualisation.aab
          ls -lh dist

      - name: Publier les fichiers en artefact
        uses: actions/upload-artifact@v4
        with:
          name: annualisation-android
          path: dist/
          retention-days: 90

      # Publie une release et crée le tag correspondant si nécessaire :
      # sur un push de tag v*, ou sur demande explicite lors d'un lancement manuel.
      - name: Publier la release GitHub
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version_name || github.ref_name }}
          name: Application Android v${{ github.event.inputs.version_name || github.ref_name }}
          files: |
            dist/annualisation.apk
            dist/annualisation.aab
          body: |
            Application Android **Suivi Annualisation**.

            📥 Téléchargez `annualisation.apk` ci-dessous et ouvrez le fichier sur votre
            téléphone Android pour l'installer.
