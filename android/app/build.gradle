plugins {
    id 'com.android.application'
}

// La configuration de signature est lue depuis les variables d'environnement
// (CI GitHub Actions) ou depuis un fichier keystore.properties local, non versionné.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}
def ksPath  = System.getenv('ANDROID_KEYSTORE_PATH')      ?: keystoreProps.getProperty('storeFile')
def ksPass  = System.getenv('ANDROID_KEYSTORE_PASSWORD')  ?: keystoreProps.getProperty('storePassword')
def ksAlias = System.getenv('ANDROID_KEY_ALIAS')          ?: keystoreProps.getProperty('keyAlias', 'annualisation')
def ksKeyPw = System.getenv('ANDROID_KEY_PASSWORD')       ?: keystoreProps.getProperty('keyPassword')

android {
    namespace 'fr.but.mag17.annualisation'
    compileSdk 34

    defaultConfig {
        applicationId 'fr.but.mag17.annualisation'
        minSdk 21
        targetSdk 34
        // Surchargeables par la CI : VERSION_CODE / VERSION_NAME
        versionCode (System.getenv('VERSION_CODE') ?: '1').toInteger()
        versionName System.getenv('VERSION_NAME') ?: '1.0.0'
    }

    signingConfigs {
        release {
            if (ksPath != null && ksPass != null) {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias ksAlias
                keyPassword ksKeyPw ?: ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signature release si le keystore est disponible, sinon build non signé
            if (ksPath != null && ksPass != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
